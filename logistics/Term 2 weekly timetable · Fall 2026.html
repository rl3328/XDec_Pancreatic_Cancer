const COURSES = {fa:["Foundations A","GS-GS-6600"],fb:["Foundations B","GS-GS-6400"],qcm:["QCM Biosciences 1","GS-QC-6401"],sem:["Seminar in Quant. Biosciences","GS-QC-5105"],adv:["Advanced Topics in QCB","GS-QC-5110"]};
const WEEKS = ["2026-10-12","2026-10-19","2026-10-26","2026-11-02","2026-11-09","2026-11-16","2026-11-23","2026-11-30","2026-12-07"];
const NOTES = {
 1:["soft","Mon Oct 19 is the last day to drop/add."],
 2:["","Foundations A Exam 2 · Wed Oct 28, 1:00–4:00 pm in M112 (not the usual room)."],
 6:["soft","Thanksgiving: no classes Thu Nov 26 & Fri Nov 27. Term 3 registration is open Nov 23 – Dec 4."],
 7:["soft","Last week of classes (last class day Fri Dec 4). Term 3 registration closes Dec 4."],
 8:["","Final exams week."]};
const HOL = {"2026-11-26":"Thanksgiving","2026-11-27":"Thanksgiving"};
const START=9, END=18.75, HR=70;
const DN=["Mon","Tue","Wed","Thu","Fri"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
document.documentElement.style.setProperty("--hr",HR+"px");
const P=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>MON[d.getMonth()]+" "+d.getDate();
const hm=t=>{const[h,m]=t.split(":").map(Number);return h+m/60};
const t12=t=>{let[h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap};
const cvar=e=>e.exam?"var(--exam)":`var(--${e.course})`;
function defaultWeek(){const t=new Date();for(let i=WEEKS.length-1;i>=0;i--){if(t>=P(WEEKS[i]))return i}return 0}
let cur=defaultWeek();
try{const s=localStorage.getItem("t2week");if(s!==null&&+s>=0&&+s<WEEKS.length)cur=+s}catch(e){}

const strip=document.getElementById("strip");
WEEKS.forEach((w,i)=>{const b=document.createElement("button");b.className="wk";const mon=P(w);
 const hasExam=EVENTS.some(e=>e.exam&&P(e.date)>=mon&&P(e.date)<addD(mon,5));
 b.innerHTML=`<b>${i===8?"Exams":"Week "+(i+1)}</b><span>${fmt(mon)} – ${fmt(addD(mon,4))}</span>`+(hasExam?'<i class="flag" title="Exam this week"></i>':"");
 b.onclick=()=>show(i);strip.appendChild(b)});

document.getElementById("legend").innerHTML=Object.entries(COURSES).map(([k,v])=>`<span><i style="background:var(--${k})"></i>${v[0]}</span>`).join("")+`<span><i style="background:var(--exam)"></i>Exam</span>`;

function evDetail(e){const c=COURSES[e.course];
 document.getElementById("detail").innerHTML=`<h2 style="color:${cvar(e)}">${c[0]} <span style="color:var(--muted);font-weight:400;font-size:.9rem">${e.code}</span></h2>
 <p><strong>${e.topic}</strong></p><p>${DN[P(e.date).getDay()-1]}, ${fmt(P(e.date))} · ${t12(e.start)} – ${t12(e.end)} · Room ${e.room}</p>${e.note?`<p class="hint">${e.note}</p>`:""}`}

function show(i){cur=Math.max(0,Math.min(WEEKS.length-1,i));try{localStorage.setItem("t2week",cur)}catch(e){}
 const mon=P(WEEKS[cur]);
 document.getElementById("title").textContent=(cur===8?"Exam week":"Week "+(cur+1))+": "+fmt(mon)+" – "+fmt(addD(mon,4));
 document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===WEEKS.length-1;
 [...strip.children].forEach((b,j)=>b.setAttribute("aria-current",j===cur));
 const n=NOTES[cur],bn=document.getElementById("banner");bn.className="banner"+(n&&n[0]?" "+n[0]:"");bn.textContent=n?n[1]:"";
 const g=document.getElementById("grid");g.innerHTML="";
 g.appendChild(Object.assign(document.createElement("div"),{className:"dayhead"}));
 const days=[0,1,2,3,4].map(k=>addD(mon,k));
 days.forEach((d,k)=>{const h=document.createElement("div");h.className="dayhead"+(HOL[iso(d)]?" off":"");h.innerHTML=`<b>${DN[k]}</b><span>${fmt(d)}</span>`;g.appendChild(h)});
 const H=(END-START)*HR;const tc=document.createElement("div");tc.className="times";tc.style.height=H+"px";
 for(let h=START;h<=18;h++){const t=document.createElement("div");t.style.top=(h-START)*HR+"px";t.textContent=(h%12||12)+(h<12?"a":"p");if(h>START)tc.appendChild(t)}
 g.appendChild(tc);
 const list=document.getElementById("list");list.innerHTML="";
 days.forEach((d,k)=>{const col=document.createElement("div");col.className="col"+(HOL[iso(d)]?" off":"");col.style.height=H+"px";
  const evs=EVENTS.filter(e=>e.date===iso(d)).sort((a,b)=>a.start.localeCompare(b.start));
  if(HOL[iso(d)])col.innerHTML=`<div class="hol">${HOL[iso(d)]}<br>no classes</div>`;
  const sec=document.createElement("section");sec.innerHTML=`<h3>${DN[k]}, ${fmt(d)}</h3>`;
  evs.forEach(e=>{const c=COURSES[e.course];const b=document.createElement("button");b.className="ev"+(e.exam?" exam":"");
   b.style.setProperty("--c",cvar(e));const top=(hm(e.start)-START)*HR,ht=(hm(e.end)-hm(e.start))*HR;
   b.style.top=top+1+"px";b.style.height=ht-2+"px";b.setAttribute("aria-pressed","false");
   const generic=["Lecture","Seminar","Session"].includes(e.topic);
   b.innerHTML=`<div class="t">${t12(e.start)}–${t12(e.end)} · ${e.room}</div><div class="n">${c[0]}</div>`+(generic?"":`<div class="p" style="-webkit-line-clamp:${ht<90?1:3}">${e.topic}</div>`);
   b.setAttribute("aria-label",`${c[0]}, ${e.topic}, ${t12(e.start)} to ${t12(e.end)}, room ${e.room}`);
   b.onclick=()=>{g.querySelectorAll(".ev").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");evDetail(e)};
   col.appendChild(b);
   const it=document.createElement("div");it.className="item"+(e.exam?" exam":"");it.style.setProperty("--c",cvar(e));
   it.innerHTML=`<div class="tm">${t12(e.start)}<br>${t12(e.end)}</div><div><div class="nm">${c[0]}</div><div class="tp">${e.topic}</div><div class="rm">Room ${e.room}${e.note?" · "+e.note:""}</div></div>`;
   sec.appendChild(it)});
  if(!evs.length)sec.insertAdjacentHTML("beforeend",`<div class="none">${HOL[iso(d)]?HOL[iso(d)]+", no classes":"No classes"}</div>`);
  g.appendChild(col);list.appendChild(sec)});
 document.getElementById("detail").innerHTML='<p class="hint">Select a class to see its topic, lecturer and reading.</p>';
}
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("today").onclick=()=>show(defaultWeek());
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
show(cur);
